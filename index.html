<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주도 · 물결치는 바다와 태양</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #eef3ff; }
    canvas { display: block; }
    #panel {
      position: fixed; top: 12px; left: 12px; width: 290px; max-height: calc(100% - 24px); overflow-y: auto;
      background: rgba(12, 20, 44, .62); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.2);
      border-radius: 14px; padding: 12px 14px; font-size: .88rem; z-index: 5;
    }
    #panel h1 { font-size: 1.05rem; margin-bottom: 8px; color: #ffd166; display: flex; justify-content: space-between; align-items: center; }
    #toggle { background: none; border: 0; color: #fff; font-size: 1.1rem; cursor: pointer; }
    #panel.collapsed .body { display: none; }
    .row { margin: 8px 0; }
    .row label { display: flex; justify-content: space-between; margin-bottom: 2px; color: #cfd8ff; }
    .row b { color: #7cf2ff; font-family: Consolas, monospace; }
    input[type=range] { width: 100%; accent-color: #ff9e5e; }
    select, button.b, .file {
      font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.1); color: #fff; cursor: pointer;
    }
    select option { color: #222; }
    button.b:hover, .file:hover { background: rgba(255,255,255,.22); }
    button.b.main { background: linear-gradient(135deg, #ffd166, #ff9e5e); color: #3a2400; border-color: transparent; font-weight: bold; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .sun { margin-top: 6px; font-size: .8rem; color: #b9c6ff; }
    .note { margin-top: 8px; font-size: .75rem; color: #98a6dd; line-height: 1.5; }
    #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 9; background: #0b1020; font-size: 1.05rem; line-height: 1.7; }
    #msg small { display: block; color: #98a6dd; margin-top: 8px; }
    #hint { position: fixed; right: 12px; bottom: 10px; font-size: .75rem; color: rgba(255,255,255,.75); text-shadow: 0 1px 3px rgba(0,0,0,.7); z-index: 4; }
    @media (max-width: 600px) { #panel { width: calc(100% - 24px); } }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="msg">🌊 제주도를 만드는 중…<small>인터넷 연결이 필요합니다 (three.js 불러오기)</small></div>

  <div id="panel">
    <h1><span>🌴 제주도 · 바다와 태양</span><button id="toggle" title="접기/펼치기">▾</button></h1>
    <div class="body">
      <div class="btns">
        <button class="b main" id="play">⏸ 멈춤</button>
        <select id="date" title="날짜">
          <option value="12-21">동지 (12/21)</option>
          <option value="9-23">추분 (9/23)</option>
          <option value="6-21">하지 (6/21)</option>
        </select>
      </div>
      <div class="row"><label>🕒 시각 <b id="clock">09:00</b></label><input type="range" id="hour" min="5.5" max="18.5" step="0.01" value="8.5"></div>
      <div class="row"><label>⏩ 태양 이동 속도 <b id="spdv">0.35</b></label><input type="range" id="spd" min="0.05" max="2" step="0.05" value="0.35"></div>
      <div class="row"><label>🌊 파도 높이 <b id="ampv">1.0</b></label><input type="range" id="amp" min="0.2" max="2.5" step="0.05" value="1"></div>
      <div class="row"><label>💨 파도 속도 <b id="wspv">1.0</b></label><input type="range" id="wsp" min="0.2" max="3" step="0.05" value="1"></div>
      <div class="row"><label>⛰️ 지형 높이 과장 <b id="vexv">2.5</b></label><input type="range" id="vex" min="1" max="5" step="0.1" value="2.5"></div>
      <div class="row"><label>📷 카메라</label>
        <div class="btns">
          <button class="b" data-cam="north">북쪽 바다</button>
          <button class="b" data-cam="air">조감</button>
          <button class="b" data-cam="sunset">석양</button>
        </div>
      </div>
      <div class="row"><label>🗺️ 실제 DEM(높이맵 이미지)</label>
        <label class="file">이미지 선택<input type="file" id="demfile" accept="image/*" hidden></label>
        <button class="b" id="demreset">가상 지형</button>
      </div>
      <div class="sun" id="sunInfo"></div>
      <div class="note"><a href="guide.html" style="color:#7cf2ff">🌴 여행 가이드 · 배열학습 애니메이션 보기 →</a></div>
      <div class="note">마우스 왼쪽 드래그: 회전 · 휠: 확대/축소 · 오른쪽 드래그: 이동.<br>
        DEM: 흰색=고도가 높은 곳, 검정=바다인 그레이스케일 이미지(동서 96km × 남북 64km 범위, 최고 1947m 기준).</div>
    </div>
  </div>
  <div id="hint">태양: 제주 위도 33.4° 천문 계산 · 1 단위 = 100 m</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);

/* ================= 설정 ================= */
const UNIT_M = 100;                 // 1 단위 = 100 m
const W_KM = 96, H_KM = 64;         // 지형이 덮는 범위(km)
const NX = 320;                     // 지형 가로 정점 수
const SEA_DEPTH_M = 100;           // 먼 바다 수심(m). 90m 이상이면 바깥 바다와 색이 이어짐
const LAT = 33.4;
const MAX_ELEV = 1947;
let VEX = 2.5;                      // 지형 높이 과장
const WU = W_KM * 1000 / UNIT_M, HU = H_KM * 1000 / UNIT_M;

/* ================= 렌더러 / 씬 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbcd3ea, 0.00045);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.499;
controls.minDistance = 5;
controls.maxDistance = 3000;

const CAMS = {
  north:  { pos: [40, 22, -400],  target: [0, 32, 40] },     // 북쪽 바다 → 남쪽(한라산 + 태양)
  air:    { pos: [0, 260, -540],  target: [0, 10, 0] },
  sunset: { pos: [560, 24, 20],   target: [0, 26, 0] }       // 동쪽 → 서쪽 석양
};
function setCam(k) {
  const c = CAMS[k];
  camera.position.set(...c.pos);
  controls.target.set(...c.target);
  controls.update();
}
setCam('north');

/* ================= 난수 / 블러 ================= */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function gauss(a, nx, ny, sigma) {
  const r = Math.max(1, Math.ceil(sigma * 3));
  const k = new Float32Array(2 * r + 1); let s = 0;
  for (let i = -r; i <= r; i++) { k[i + r] = Math.exp(-(i * i) / (2 * sigma * sigma)); s += k[i + r]; }
  for (let i = 0; i < k.length; i++) k[i] /= s;
  const tmp = new Float32Array(nx * ny), out = new Float32Array(nx * ny);
  for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
    let v = 0; for (let i = -r; i <= r; i++) { const xx = Math.min(nx - 1, Math.max(0, x + i)); v += a[y * nx + xx] * k[i + r]; }
    tmp[y * nx + x] = v;
  }
  for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
    let v = 0; for (let i = -r; i <= r; i++) { const yy = Math.min(ny - 1, Math.max(0, y + i)); v += tmp[yy * nx + x] * k[i + r]; }
    out[y * nx + x] = v;
  }
  return out;
}
const smooth01 = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

/* ================= 지형 높이 만들기 (행 0 = 북쪽) ================= */
function proceduralHeights(nx, ny) {
  const rng = mulberry32(7);
  const randn = () => Math.sqrt(-2 * Math.log(1 - rng())) * Math.cos(2 * Math.PI * rng());
  const field = (sigma) => {
    const a = new Float32Array(nx * ny); for (let i = 0; i < a.length; i++) a[i] = randn();
    const b = gauss(a, nx, ny, sigma); let m = 1e-6; for (const v of b) m = Math.max(m, Math.abs(v));
    for (let i = 0; i < b.length; i++) b[i] /= m; return b;
  };
  const noise = field(18), n6 = field(6), n25 = field(2.5), nf = field(2.0);
  const h = new Float32Array(nx * ny), s = new Float32Array(nx * ny);
  const X = new Float32Array(nx * ny), Y = new Float32Array(nx * ny);
  const ang = 6 * Math.PI / 180, ca = Math.cos(ang), sa = Math.sin(ang);
  const aKm = 36.5, bKm = 15.8, hx = -3.0, hy = 0.0;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const idx = j * nx + i;
    const x = -W_KM / 2 + i * W_KM / (nx - 1), y = H_KM / 2 - j * H_KM / (ny - 1);
    X[idx] = x; Y[idx] = y;
    const xr = x * ca + y * sa, yr = -x * sa + y * ca;
    const r = Math.hypot(xr / aKm, yr / bKm) * (1 + 0.10 * noise[idx]);
    const sv = Math.min(1, Math.max(0, 1 - r)); s[idx] = sv;
    const rh = Math.hypot(x - hx, y - hy);
    let v = 1950 * Math.pow(sv, 2.4);
    v *= 1 + 0.55 * Math.exp(-Math.pow(rh / 9, 2));
    v = Math.min(v, 1947);
    if (sv > 0.5) v -= 130 * Math.exp(-Math.pow(rh / 0.55, 2));      // 백록담
    v *= 1 + 0.4 * nf[idx] * 0.25;
    v += (70 * n6[idx] + 22 * n25[idx]) * smooth01(sv * 5);
    h[idx] = sv > 0 ? Math.max(v, 0) : 0;
  }
  // 오름 360개
  const cand = []; for (let i = 0; i < s.length; i++) if (s[i] > 0.12) cand.push(i);
  for (let n = 0; n < 360; n++) {
    const c = cand[Math.floor(rng() * cand.length)];
    const px = X[c], py = Y[c], rad = 0.5 + rng() * 0.8, hh = (60 + rng() * 220) * (0.4 + s[c]);
    const ci = c % nx, cj = (c / nx) | 0, rc = Math.ceil(rad * 3 / (W_KM / nx)) + 1;
    for (let j = Math.max(0, cj - rc); j <= Math.min(ny - 1, cj + rc); j++)
      for (let i = Math.max(0, ci - rc); i <= Math.min(nx - 1, ci + rc); i++) {
        const idx = j * nx + i, d2 = (X[idx] - px) ** 2 + (Y[idx] - py) ** 2;
        h[idx] += hh * Math.exp(-d2 / (rad * rad)) * smooth01(s[idx] * 6);
      }
  }
  for (let i = 0; i < h.length; i++) if (s[i] <= 0) h[i] = 0;
  return h;
}

function addBathymetry(h, nx, ny) {
  const mask = new Float32Array(h.length);
  for (let i = 0; i < h.length; i++) mask[i] = h[i] > 0.5 ? 1 : 0;
  const kmPerCell = W_KM / nx;
  const p = gauss(mask, nx, ny, Math.max(2, 7 / kmPerCell));
  for (let i = 0; i < h.length; i++) {
    if (h[i] > 0.5) continue;
    h[i] = -SEA_DEPTH_M * Math.pow(smooth01((0.5 - p[i]) / 0.5), 0.8);
  }
  return h;
}

/* ================= 지형 메시 + 수심 텍스처 ================= */
let terrain = null, depthTex = null, heights = null, GNX = NX, GNY = Math.round(NX * H_KM / W_KM);

function buildTerrain(h, nx, ny) {
  heights = h; GNX = nx; GNY = ny;
  if (terrain) { terrain.geometry.dispose(); scene.remove(terrain); }
  const pos = new Float32Array(nx * ny * 3), col = new Float32Array(nx * ny * 3);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const idx = j * nx + i;
    pos[idx * 3] = -WU / 2 + i * WU / (nx - 1);
    // 육지는 VEX배 과장, 해저는 파도 골보다 깊게(10배) → 해저가 수면 위로 비쳐 나오지 않음
    pos[idx * 3 + 1] = h[idx] * (h[idx] < 0 ? 10 : VEX) / UNIT_M;
    pos[idx * 3 + 2] = -HU / 2 + j * HU / (ny - 1);
  }
  const index = [];
  for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
    const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
    index.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setIndex(index);
  geo.computeVertexNormals();
  // 높이 + 경사에 따른 색
  const nrm = geo.attributes.normal, tmp = new THREE.Color();
  const stops = [[-100, '#3b3a2c'], [-8, '#8a7f5e'], [0, '#d8c99b'], [6, '#d4c48f'], [20, '#4d7a2e'], [500, '#3f6d28'],
                 [900, '#6b6b3c'], [1400, '#6e5f4b'], [1750, '#8a8580'], [1950, '#bdb9b4']];
  for (let i = 0; i < nx * ny; i++) {
    const m = h[i];
    let k = 0; while (k < stops.length - 2 && m > stops[k + 1][0]) k++;
    const t = Math.min(1, Math.max(0, (m - stops[k][0]) / (stops[k + 1][0] - stops[k][0])));
    tmp.set(stops[k][1]).lerp(new THREE.Color(stops[k + 1][1]), t);
    const slope = 1 - nrm.getY(i);
    const rock = smooth01((slope - 0.12) / 0.25) * (m > 15 ? 1 : 0);
    tmp.lerp(new THREE.Color('#6f6a63'), rock * 0.75);
    const v = 0.92 + 0.16 * ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1;
    col[i * 3] = tmp.r * v; col[i * 3 + 1] = tmp.g * v; col[i * 3 + 2] = tmp.b * v;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 }));
  terrain.castShadow = true; terrain.receiveShadow = true;
  scene.add(terrain);

  // 수심 텍스처 (R = 수심/150m, 육지는 0)
  const data = new Uint8Array(nx * ny * 4);
  for (let i = 0; i < nx * ny; i++) {
    const d = h[i] < 0 ? Math.min(255, Math.round(-h[i] / 150 * 255)) : 0;
    data[i * 4] = d; data[i * 4 + 1] = h[i] > 0 ? 255 : 0; data[i * 4 + 2] = 0; data[i * 4 + 3] = 255;
  }
  if (depthTex) depthTex.dispose();
  depthTex = new THREE.DataTexture(data, nx, ny, THREE.RGBAFormat);
  depthTex.magFilter = THREE.LinearFilter; depthTex.minFilter = THREE.LinearFilter;
  depthTex.wrapS = depthTex.wrapT = THREE.ClampToEdgeWrapping;
  depthTex.needsUpdate = true;
  if (water) water.material.uniforms.uDepthTex.value = depthTex;
}

/* ================= 하늘 / 바다 공통 GLSL ================= */
const SKY_GLSL = /* glsl */`
  uniform vec3 uSunDir, uHorizon, uZenith, uSunTint;
  vec3 skyCol(vec3 dir) {
    float h = max(dir.y, 0.0);
    vec3 col = mix(uHorizon, uZenith, pow(h, 0.45));
    float mu = max(dot(dir, uSunDir), 0.0);
    col += uSunTint * (pow(mu, 5.0) * 0.18 + pow(mu, 48.0) * 0.45 + pow(mu, 500.0) * 2.5) * (1.0 - h * 0.6);
    float disc = smoothstep(0.99987, 0.99995, dot(dir, uSunDir));
    col += uSunTint * disc * 45.0 * step(-0.02, uSunDir.y);
    return col;
  }
`;

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, depthTest: false,
  uniforms: { uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uHorizon: { value: new THREE.Vector3() }, uZenith: { value: new THREE.Vector3() }, uSunTint: { value: new THREE.Vector3(1, 1, 1) } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vDir;` + SKY_GLSL + `
    void main(){ gl_FragColor = vec4(skyCol(normalize(vDir)), 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(9000, 48, 24), skyMat);
sky.frustumCulled = false; sky.renderOrder = -10;
scene.add(sky);

/* ================= 바다 ================= */
const WAVE_L = [150, 95, 62, 38, 24, 14];     // 파장(단위). 앞 3개는 메시를 실제로 출렁이게 함
const waveU1 = [], waveU2 = [];
{
  const base = 215 * Math.PI / 180;           // 파도가 오는 방향(방위각, 북=0 시계방향)
  const spread = [0, 25, -30, 45, -50, 70];
  WAVE_L.forEach((L, i) => {
    const az = base + spread[i] * Math.PI / 180;
    const d = new THREE.Vector2(Math.sin(az), -Math.cos(az));   // 북 = -z
    const k = 2 * Math.PI / L;
    const A = L * 0.0105;
    const w = Math.sqrt(9.8 * k * 28) ;                         // 보기 좋은 속도로 조정
    waveU1.push(new THREE.Vector4(d.x, d.y, k, A));
    waveU2.push(new THREE.Vector3(w, 0.75, i * 1.7));
  });
}

const WAVE_GLSL = /* glsl */`
  uniform float uTime, uAmp;
  uniform vec4 uW1[6]; uniform vec3 uW2[6];
  uniform sampler2D uDepthTex; uniform vec2 uWorldSize;
  float depthAt(vec2 p){
    vec2 uv = (p + uWorldSize * 0.5) / uWorldSize;
    if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return 150.0;
    return texture2D(uDepthTex, uv).r * 150.0;
  }
  float ampFactor(float d){ return 0.08 + 0.92 * smoothstep(0.0, 60.0, d); }
`;

const waterMat = new THREE.ShaderMaterial({
  transparent: true,
  uniforms: {
    uTime: { value: 0 }, uAmp: { value: 1 }, uW1: { value: waveU1 }, uW2: { value: waveU2 },
    uDepthTex: { value: null }, uWorldSize: { value: new THREE.Vector2(WU, HU) },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uHorizon: { value: new THREE.Vector3() },
    uZenith: { value: new THREE.Vector3() }, uSunTint: { value: new THREE.Vector3(1, 1, 1) },
    uDay: { value: 1 }, uFog: { value: 0.00045 }, uFoamT: { value: 0.16 }
  },
  vertexShader: WAVE_GLSL + `
    varying vec3 vWorld; varying vec2 vP;
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vec2 p = wp.xz;
      float fa = ampFactor(depthAt(p));
      vec3 disp = vec3(0.0);
      for (int i = 0; i < 3; i++) {
        vec2 d = uW1[i].xy; float k = uW1[i].z; float A = uW1[i].w * uAmp * fa;
        float th = k * dot(d, p) - uW2[i].x * uTime + uW2[i].z;
        disp.xz += uW2[i].y * A * d * cos(th);
        disp.y += A * sin(th);
      }
      wp.xyz += disp;
      vWorld = wp.xyz; vP = p;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: WAVE_GLSL + SKY_GLSL + `
    uniform float uDay, uFog, uFoamT;
    varying vec3 vWorld; varying vec2 vP;
    float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float vnoise(vec2 p){
      vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash21(i), hash21(i + vec2(1,0)), f.x), mix(hash21(i + vec2(0,1)), hash21(i + vec2(1,1)), f.x), f.y);
    }
    void main(){
      float depth = depthAt(vP);
      float fa = ampFactor(depth);
      vec3 n = vec3(0.0, 1.0, 0.0);
      float comp = 0.0;
      for (int i = 0; i < 6; i++) {
        vec2 d = uW1[i].xy; float k = uW1[i].z; float A = uW1[i].w * uAmp * fa;
        float th = k * dot(d, vP) - uW2[i].x * uTime + uW2[i].z;
        float c = cos(th), s = sin(th);
        n.xz -= d * k * A * c;
        n.y  -= uW2[i].y * k * A * s;
        comp += uW2[i].y * k * A * s;
      }
      float dist = length(cameraPosition - vWorld);
      // 잔물결 (태양 반짝임)
      vec2 q = vP * 0.55;
      vec2 rip = vec2(vnoise(q + vec2(uTime * 0.7, 0.0)) - 0.5, vnoise(q * 1.37 + vec2(0.0, -uTime * 0.6)) - 0.5)
               + 0.6 * vec2(vnoise(q * 3.1 - uTime * 0.9) - 0.5, vnoise(q * 2.7 + uTime * 0.8) - 0.5);
      n.xz += rip * 0.22 * (0.5 + 0.5 * uAmp) / (1.0 + dist * 0.0025);
      n = normalize(n);

      vec3 v = normalize(cameraPosition - vWorld);
      float ndv = max(dot(n, v), 0.0);
      float F = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);
      vec3 r = reflect(-v, n); r.y = abs(r.y);
      vec3 refl = skyCol(r);

      float dfac = smoothstep(0.0, 90.0, depth);
      vec3 shallow = vec3(0.05, 0.42, 0.42), deep = vec3(0.004, 0.05, 0.11);
      vec3 base = mix(shallow, deep, dfac) * (0.15 + 0.85 * uDay) * (0.45 + 0.55 * max(uSunDir.y, 0.0));

      vec3 hv = normalize(uSunDir + v);
      float spec = pow(max(dot(n, hv), 0.0), 700.0) * 6.0 + pow(max(dot(n, hv), 0.0), 70.0) * 0.12;
      vec3 col = mix(base, refl, F) + uSunTint * spec * step(0.0, uSunDir.y);

      // 파도 마루 + 해안 포말
      float f1 = smoothstep(uFoamT, uFoamT + 0.12, comp) * (0.45 + vnoise(vP * 0.6 + uTime * 0.25));
      float f2 = (1.0 - smoothstep(0.0, 7.0, depth)) * (0.55 + 0.45 * sin(depth * 0.9 - uTime * 2.2)) * (0.5 + vnoise(vP * 0.9));
      float foam = clamp(f1 + f2, 0.0, 1.0);
      vec3 foamCol = vec3(0.92, 0.96, 1.0) * (0.12 + 0.88 * uDay) * (0.35 + 0.65 * max(uSunDir.y, 0.0) + 0.2);
      col = mix(col, foamCol, foam * 0.85);

      float fogF = 1.0 - exp(-dist * uFog);
      col = mix(col, uHorizon, fogF);
      float alpha = mix(0.38, 1.0, dfac);
      alpha = max(alpha, max(F, foam));
      alpha = mix(alpha, 1.0, fogF);
      gl_FragColor = vec4(col, alpha);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});

// 가운데는 촘촘하고 멀수록 성긴 격자 (수평선까지)
function makeOceanGeometry(R, seg) {
  const g = new THREE.PlaneGeometry(2, 2, seg, seg);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i), w = p.getZ(i);
    p.setX(i, Math.sign(u) * u * u * R);
    p.setZ(i, Math.sign(w) * w * w * R);
  }
  p.needsUpdate = true;
  return g;
}
const water = new THREE.Mesh(makeOceanGeometry(7000, 480), waterMat);
water.frustumCulled = false;
water.renderOrder = 1;
scene.add(water);

/* ================= 조명 ================= */
const sunLight = new THREE.DirectionalLight(0xffffff, 3);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
const sc = sunLight.shadow.camera; sc.left = -480; sc.right = 480; sc.top = 480; sc.bottom = -480; sc.near = 10; sc.far = 4000;
sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = 0.6;
scene.add(sunLight, sunLight.target);
const hemi = new THREE.HemisphereLight(0xaac8ff, 0x4a4a3a, 0.8);
scene.add(hemi);

/* ================= 태양 ================= */
const CUM = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
function sunState(hour, month, day) {
  const n = CUM[month - 1] + day;
  const decl = 23.44 * Math.PI / 180 * Math.sin(2 * Math.PI * (284 + n) / 365);
  const phi = LAT * Math.PI / 180, H = (hour - 12) * 15 * Math.PI / 180;
  const sinEl = Math.sin(phi) * Math.sin(decl) + Math.cos(phi) * Math.cos(decl) * Math.cos(H);
  const el = Math.asin(Math.max(-1, Math.min(1, sinEl)));
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(decl) * Math.cos(phi)) + Math.PI;
  return { el, az: (az + 2 * Math.PI) % (2 * Math.PI) };
}
const lerp3 = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
function skyPalette(elDeg) {
  const nightH = [0.012, 0.018, 0.04], nightZ = [0.002, 0.004, 0.014];
  const duskH = [0.95, 0.42, 0.22], duskZ = [0.07, 0.11, 0.30];
  const dayH = [0.55, 0.68, 0.84], dayZ = [0.09, 0.24, 0.58];
  const a = smooth01((elDeg + 8) / 8), b = smooth01((elDeg - 1) / 24);
  return { H: lerp3(lerp3(nightH, duskH, a), dayH, b), Z: lerp3(lerp3(nightZ, duskZ, a), dayZ, b) };
}

let hour = 8.5, playing = true, dateMD = [12, 21], hoursPerSec = 0.35, waveSpeed = 1, ampV = 1;

function updateSun() {
  const { el, az } = sunState(hour, dateMD[0], dateMD[1]);
  const elDeg = el * 180 / Math.PI;
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)); // 동 +x, 북 -z
  const pal = skyPalette(elDeg);
  const warm = [1.0, 0.52, 0.22], white = [1.0, 0.95, 0.85];
  const tint = lerp3(warm, white, smooth01(elDeg / 28));
  const day = smooth01((elDeg + 3) / 12);
  const tintV = tint.map(v => v * (0.15 + 0.85 * day) * (elDeg < -2 ? 0 : 1));

  for (const m of [skyMat, waterMat]) {
    const u = m.uniforms;
    u.uSunDir.value.copy(dir); u.uHorizon.value.set(...pal.H); u.uZenith.value.set(...pal.Z); u.uSunTint.value.set(...tintV);
  }
  waterMat.uniforms.uDay.value = day;
  scene.fog.color.setRGB(...pal.H);
  scene.background = null;

  sunLight.position.copy(dir).multiplyScalar(1800);
  sunLight.target.position.set(0, 0, 0);
  sunLight.color.setRGB(...tint);
  sunLight.intensity = 3.2 * smooth01((elDeg + 1) / 9);
  hemi.color.setRGB(pal.Z[0] * 3 + 0.2, pal.Z[1] * 3 + 0.2, pal.Z[2] * 2 + 0.3);
  hemi.intensity = 0.15 + 0.75 * day;
  renderer.toneMappingExposure = 0.85;

  const hh = Math.floor(hour), mm = Math.floor((hour - hh) * 60);
  $('clock').textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  $('hour').value = hour;
  const compass = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'][Math.round(az / (Math.PI / 4)) % 8];
  $('sunInfo').textContent = `☀️ 태양 고도 ${elDeg.toFixed(1)}° · 방위 ${(az * 180 / Math.PI).toFixed(0)}° (${compass}쪽)` + (elDeg < 0 ? ' · 해가 진 상태' : '');
}

/* ================= DEM 이미지 ================= */
function loadDemImage(file) {
  const img = new Image();
  img.onload = () => {
    const ny = Math.round(NX * H_KM / W_KM);
    const cv = document.createElement('canvas'); cv.width = NX; cv.height = ny;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.drawImage(img, 0, 0, NX, ny);
    const px = cx.getImageData(0, 0, NX, ny).data;
    const h = new Float32Array(NX * ny);
    for (let i = 0; i < h.length; i++) h[i] = px[i * 4] / 255 * MAX_ELEV;
    addBathymetry(h, NX, ny);
    buildTerrain(h, NX, ny);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
}

/* ================= UI ================= */
$('toggle').onclick = () => { const p = $('panel'); p.classList.toggle('collapsed'); $('toggle').textContent = p.classList.contains('collapsed') ? '▸' : '▾'; };
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸ 멈춤' : '▶ 재생'; };
$('hour').oninput = e => { hour = +e.target.value; playing = false; $('play').textContent = '▶ 재생'; updateSun(); };
$('date').onchange = e => { dateMD = e.target.value.split('-').map(Number); updateSun(); };
$('spd').oninput = e => { hoursPerSec = +e.target.value; $('spdv').textContent = hoursPerSec.toFixed(2); };
$('amp').oninput = e => { ampV = +e.target.value; $('ampv').textContent = ampV.toFixed(1); };
$('wsp').oninput = e => { waveSpeed = +e.target.value; $('wspv').textContent = waveSpeed.toFixed(1); };
$('vex').oninput = e => { VEX = +e.target.value; $('vexv').textContent = VEX.toFixed(1); if (heights) buildTerrain(heights, GNX, GNY); };
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => setCam(b.dataset.cam));
$('demfile').onchange = e => { if (e.target.files[0]) loadDemImage(e.target.files[0]); };
$('demreset').onclick = () => { const ny = GNY; buildTerrain(addBathymetry(proceduralHeights(NX, ny), NX, ny), NX, ny); };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= 시작 ================= */
{
  const ny = GNY;
  buildTerrain(addBathymetry(proceduralHeights(NX, ny), NX, ny), NX, ny);
  updateSun();
  $('msg').remove();
}

// 주소 매개변수로 상태 지정 가능: ?hour=10.5&date=6-21&cam=sunset&play=0&panel=0&amp=1.5
{
  const q = new URLSearchParams(location.search);
  if (q.has('date')) { $('date').value = q.get('date'); dateMD = q.get('date').split('-').map(Number); }
  if (q.has('hour')) hour = +q.get('hour');
  if (q.has('amp')) { ampV = +q.get('amp'); $('amp').value = ampV; $('ampv').textContent = ampV.toFixed(1); }
  if (q.has('cam') && CAMS[q.get('cam')]) setCam(q.get('cam'));
  if (q.get('play') === '0') { playing = false; $('play').textContent = '▶ 재생'; }
  if (q.get('nowater') === '1') water.visible = false;      // 진단용: 지형만 보기
  if (q.get('panel') === '0') { $('panel').classList.add('collapsed'); $('toggle').textContent = '▸'; }
  updateSun();
}

let last = performance.now(), wt = 0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  wt += dt * waveSpeed;
  waterMat.uniforms.uTime.value = wt;
  waterMat.uniforms.uAmp.value = ampV;
  waterMat.uniforms.uFoamT.value = 0.16;
  waterMat.uniforms.uDepthTex.value = depthTex;
  if (playing) {
    hour += dt * hoursPerSec;
    if (hour > 18.5) hour = 5.5;
    updateSun();
  }
  controls.update();
  if (camera.position.y < 2) camera.position.y = 2;
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
